name: role-test
on:
  push:
    branches: [role-test]
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Look up a user's role with the workflow's own token
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/collaborators/anielsud/permission" --jq '"permission=\(.permission) role_name=\(.role_name)"'
